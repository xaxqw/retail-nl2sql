<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>零售经营数据智能问数</title>
<style>
  :root{
    --bg:#F6F7F9;
    --card:#FFFFFF;
    --line:#E7E9EE;
    --line-strong:#D6DAE1;
    --ink:#0F172A;
    --ink-2:#475569;
    --ink-3:#8A94A6;
    --brand:#1E3A5F;
    --accent:#2563EB;
    --accent-soft:#EFF5FF;
    --ok:#047857;
    --ok-bg:#ECFDF5;
    --warn:#B45309;
    --warn-bg:#FFFBEB;
    --err:#B91C1C;
    --err-bg:#FEF2F2;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow-md:0 4px 14px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.62;
  }
  .shell{max-width:960px;margin:0 auto;padding:0 24px 72px}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:26px 0 22px;
  }
  .mark{
    width:40px;height:40px;border-radius:11px;flex:none;
    background:linear-gradient(145deg,#24456F,#16304F);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(30,58,95,.25);
  }
  .mark svg{display:block}
  .brand-t{font-size:16.5px;font-weight:600;letter-spacing:.2px}
  .brand-s{font-size:12.5px;color:var(--ink-3);margin-top:1px}
  .status{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    font-size:12.5px;color:var(--ink-2);
    background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 13px 6px 11px;box-shadow:var(--shadow-sm);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
  .dot.on{background:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.15)}
  .dot.off{background:#EF4444;box-shadow:0 0 0 3px rgba(239,68,68,.15)}

  /* ---------- 提问卡 ---------- */
  .ask{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow-sm);
    padding:6px 6px 6px 6px;transition:border-color .18s,box-shadow .18s;
  }
  .ask:focus-within{
    border-color:#B9D0F5;
    box-shadow:0 0 0 4px rgba(37,99,235,.08),var(--shadow-sm);
  }
  textarea{
    width:100%;border:0;outline:0;resize:none;background:transparent;
    padding:14px 14px 8px;font:inherit;font-size:15px;color:var(--ink);
    min-height:52px;
  }
  textarea::placeholder{color:#A6AEBC}
  .ask-bar{
    display:flex;align-items:center;gap:12px;
    padding:2px 8px 8px 14px;
  }
  .kbd-hint{font-size:12px;color:var(--ink-3)}
  .kbd-hint kbd{
    font-family:inherit;font-size:11px;background:#F1F3F6;border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;color:var(--ink-2);
  }
  .btn{
    margin-left:auto;border:0;cursor:pointer;font:inherit;font-weight:500;
    padding:9px 22px;border-radius:9px;
    background:var(--brand);color:#fff;
    transition:background .15s,transform .1s,opacity .15s;
  }
  .btn:hover{background:#16294A}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:default}

  /* ---------- 示例 ---------- */
  .examples{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
  .chip{
    font-size:12.5px;color:var(--ink-2);background:var(--card);
    border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;cursor:pointer;
    transition:all .15s;
  }
  .chip:hover{border-color:#C3D3EC;color:var(--accent);background:#FBFCFE;transform:translateY(-1px)}

  /* ---------- 结果 ---------- */
  .result{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow-sm);
    padding:20px 22px 22px;margin-bottom:16px;
    animation:rise .22s ease-out;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .r-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:500;border-radius:6px;padding:3px 9px;
    letter-spacing:.2px;
  }
  .b-ok{background:var(--ok-bg);color:var(--ok)}
  .b-warn{background:var(--warn-bg);color:var(--warn)}
  .b-err{background:var(--err-bg);color:var(--err)}
  .b-cache{background:var(--accent-soft);color:#1D4ED8}
  .b-plain{background:#F3F4F6;color:var(--ink-2)}
  .r-time{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  .answer{
    font-size:18.5px;font-weight:500;line-height:1.62;
    letter-spacing:-.1px;color:var(--ink);margin-bottom:18px;
  }
  .metrics{
    display:flex;gap:0;border-top:1px solid #F1F3F6;border-bottom:1px solid #F1F3F6;
    padding:11px 0;margin-bottom:18px;
  }
  .m{flex:1;padding:0 2px}
  .m + .m{border-left:1px solid #F1F3F6;padding-left:18px}
  .m b{
    display:block;font-size:15px;font-weight:600;
    font-variant-numeric:tabular-nums;line-height:1.3;
  }
  .m span{font-size:11.5px;color:var(--ink-3)}

  .block-t{
    font-size:11.5px;font-weight:600;color:var(--ink-3);
    letter-spacing:.7px;text-transform:uppercase;margin-bottom:8px;
  }
  .tbl-wrap{
    border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:420px;
  }
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{
    position:sticky;top:0;z-index:1;
    background:#FAFBFC;color:var(--ink-2);font-weight:600;
    text-align:left;padding:9px 14px;white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:9px 14px;border-bottom:1px solid #F3F4F6;
    font-variant-numeric:tabular-nums;color:var(--ink-2);
  }
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#FAFBFC}
  tbody td:first-child{color:var(--ink);font-weight:500}

  details.sql{border:1px solid var(--line);border-radius:10px;margin-top:16px;overflow:hidden}
  details.sql summary{
    cursor:pointer;list-style:none;padding:10px 14px;
    font-size:12.5px;color:var(--ink-2);background:#FAFBFC;
    display:flex;align-items:center;gap:8px;user-select:none;
  }
  details.sql summary::-webkit-details-marker{display:none}
  details.sql summary::before{
    content:"";width:0;height:0;border-left:5px solid var(--ink-3);
    border-top:4px solid transparent;border-bottom:4px solid transparent;
    transition:transform .15s;
  }
  details.sql[open] summary::before{transform:rotate(90deg)}
  details.sql pre{
    margin:0;padding:14px 16px;background:#0F172A;color:#D6E2F0;
    font-family:"SF Mono",Consolas,"Courier New",monospace;
    font-size:12.5px;line-height:1.72;overflow-x:auto;
  }
  .copy{
    margin-left:auto;font-size:11.5px;color:var(--ink-3);
    border:1px solid var(--line);background:#fff;border-radius:5px;
    padding:2px 8px;cursor:pointer;font-family:inherit;
  }
  .copy:hover{color:var(--accent);border-color:#C3D3EC}

  .empty{
    background:var(--card);border:1px dashed var(--line-strong);
    border-radius:var(--radius);padding:52px 24px;text-align:center;
    color:var(--ink-3);font-size:13.5px;
  }
  .empty b{display:block;color:var(--ink-2);font-weight:500;font-size:14px;margin-bottom:5px}

  .loading{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 22px;display:flex;align-items:center;gap:12px;
    color:var(--ink-2);font-size:13.5px;
  }
  .spin{
    width:16px;height:16px;border-radius:50%;flex:none;
    border:2px solid #DFE4EC;border-top-color:var(--brand);
    animation:rot .75s linear infinite;
  }
  @keyframes rot{to{transform:rotate(360deg)}}

  .err-box{
    background:var(--card);border:1px solid #F5D6D6;border-radius:var(--radius);
    padding:20px 22px;
  }
  .err-box .t{font-size:14px;font-weight:500;color:var(--err);margin-bottom:6px}
  .err-box .d{font-size:12.5px;color:var(--ink-2);font-family:monospace;white-space:pre-wrap}

  footer{
    margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;
    font-size:11.5px;color:var(--ink-3);
  }
  footer .sep{width:1px;height:11px;background:var(--line-strong)}
  footer .live b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="mark">
      <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
        <rect x="2" y="11" width="3.4" height="8" rx="1.2" fill="#8FB8E8"/>
        <rect x="8.8" y="6" width="3.4" height="13" rx="1.2" fill="#CFE0F5"/>
        <rect x="15.6" y="2.5" width="3.4" height="16.5" rx="1.2" fill="#FFFFFF"/>
      </svg>
    </div>
    <div>
      <div class="brand-t">零售经营数据智能问数</div>
      <div class="brand-s">自然语言 → SQL → 结论</div>
    </div>
    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">连接中</span>
    </div>
  </header>

  <section class="ask">
    <textarea id="q" rows="1"
      placeholder="问点什么，比如：上个月各渠道的销售额分别是多少"></textarea>
    <div class="ask-bar">
      <span class="kbd-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 提交</span>
      <button class="btn" id="go">查询</button>
    </div>
  </section>

  <div class="examples" id="examples"></div>
  <div id="out">
    <div class="empty">
      <b>输入问题，或点上方示例开始</b>
      覆盖 4 个维表 2 个事实表，50 万条订单记录
    </div>
  </div>

  <footer>
    <span>只读查询 · 表白名单 · 写操作拦截</span>
    <span class="sep"></span>
    <span class="live">请求 <b id="mTotal">—</b></span>
    <span class="live">P50 <b id="mP50">—</b></span>
    <span class="live">缓存命中 <b id="mHit">—</b></span>
    <span class="sep"></span>
    <span>qwen2.5:7b · 本地私有化</span>
  </footer>
</div>

<script>
const EXAMPLES = [
  "上个月各渠道的销售额分别是多少",
  "退货率最高的五个品类",
  "哪个大区的客单价最高",
  "各品类的毛利率排名",
  "最近三个月京东的订单量趋势",
  "VIP 客户和新客的客单价差多少",
  "今年双11当天的销售额",
  "查一下客户000123的手机号"
];

const STATUS_MAP = {
  ok:      ["查询成功", "b-ok"],
  clarify: ["需要澄清", "b-warn"],
  reject:  ["已拒绝",   "b-err"],
  error:   ["执行失败", "b-err"]
};

const $ = id => document.getElementById(id);
const out = $("out"), ta = $("q"), go = $("go");

/* ---------- 示例 ---------- */
EXAMPLES.forEach(t => {
  const el = document.createElement("span");
  el.className = "chip";
  el.textContent = t;
  el.onclick = () => { ta.value = t; ask(); };
  $("examples").appendChild(el);
});

/* ---------- 工具 ---------- */
const esc = s => String(s ?? "")
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

function fmt(v){
  if (v === null || v === undefined) return "—";
  if (typeof v === "number"){
    if (Number.isInteger(v)) return v.toLocaleString("zh-CN");
    return v.toLocaleString("zh-CN",{maximumFractionDigits:2});
  }
  return esc(v);
}

/* ---------- 渲染 ---------- */
function render(res){
  const [label, cls] = STATUS_MAP[res.status] || [res.status, "b-err"];
  const t = res.trace || {};
  const stages = [];
  if (t.generate_ms) stages.push(`生成 ${t.generate_ms}ms`);
  if (t.execute_ms)  stages.push(`查询 ${t.execute_ms}ms`);
  if (t.summary_ms)  stages.push(`结论 ${t.summary_ms}ms`);
  if (t.retry_ms)    stages.push(`重试 ${t.retry_ms}ms`);
  if (t.cache_ms !== undefined && res.cached) stages.push(`命中 ${t.cache_ms}ms`);

  let h = '<div class="result">';
  h += '<div class="r-head">';
  h += `<span class="badge ${cls}">${label}</span>`;
  if (res.cached) h += `<span class="badge b-cache">缓存 · ${esc(res.cache)}</span>`;
  if (res.retries) h += `<span class="badge b-plain">重试 ${res.retries}</span>`;
  h += `<span class="r-time">${(res.elapsed_ms/1000).toFixed(2)} s</span>`;
  h += '</div>';

  h += `<div class="answer">${esc(res.answer) || "—"}</div>`;

  const rows = res.rows || [];
  h += '<div class="metrics">';
  h += `<div class="m"><b>${rows.length}</b><span>返回行数</span></div>`;
  h += `<div class="m"><b>${(res.elapsed_ms/1000).toFixed(2)}s</b><span>总耗时</span></div>`;
  h += `<div class="m"><b>${res.cached ? "命中" : "未命中"}</b><span>语义缓存</span></div>`;
  h += `<div class="m"><b>${esc(res.model || "qwen2.5:7b")}</b><span>推理模型</span></div>`;
  h += '</div>';

  if (rows.length && res.columns){
    h += '<div class="block-t">查询结果</div>';
    h += '<div class="tbl-wrap"><table><thead><tr>';
    res.columns.forEach(c => h += `<th>${esc(c)}</th>`);
    h += '</tr></thead><tbody>';
    rows.slice(0,50).forEach(r => {
      h += '<tr>' + r.map(v => `<td>${fmt(v)}</td>`).join("") + '</tr>';
    });
    h += '</tbody></table></div>';
    if (rows.length > 50) h += `<div style="font-size:11.5px;color:#8A94A6;margin-top:6px">仅显示前 50 行，共 ${rows.length} 行</div>`;
  }

  if (res.sql){
    h += '<details class="sql"><summary>查看生成的 SQL';
    h += `<button class="copy" data-sql="${esc(res.sql)}">复制</button>`;
    h += `</summary><pre>${esc(res.sql)}</pre></details>`;
  }

  if (stages.length){
    h += `<div style="font-size:11.5px;color:#8A94A6;margin-top:12px">${stages.join(" · ")}</div>`;
  }

  if (res.error){
    h += `<div style="font-size:12px;color:#B45309;margin-top:12px">${esc(res.error)}</div>`;
  }

  h += '</div>';
  out.innerHTML = h;

  out.querySelectorAll(".copy").forEach(b => {
    b.onclick = e => {
      e.preventDefault();
      navigator.clipboard.writeText(b.dataset.sql || "");
      b.textContent = "已复制";
      setTimeout(() => b.textContent = "复制", 1200);
    };
  });
}

/* ---------- 请求 ---------- */
async function ask(){
  const q = ta.value.trim();
  if (!q) return;
  go.disabled = true;
  out.innerHTML = '<div class="loading"><span class="spin"></span>正在生成 SQL 并执行…</div>';

  try{
    const r = await fetch("/api/ask", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });
    const data = await r.json();
    if (data.error){
      out.innerHTML = `<div class="err-box"><div class="t">请求失败</div><div class="d">${esc(data.error)}</div></div>`;
    } else {
      render(data);
    }
  } catch(e){
    out.innerHTML = `<div class="err-box"><div class="t">网络错误</div><div class="d">${esc(e.message)}</div></div>`;
  } finally {
    go.disabled = false;
    refreshMetrics();
  }
}

/* ---------- 状态与指标 ---------- */
async function refreshMetrics(){
  try{
    const r = await fetch("/api/metrics");
    const d = await r.json();
    const m = d.metrics || {}, c = d.cache || {};
    $("mTotal").textContent = m.total_requests ?? "—";
    $("mP50").textContent = m.latency_ms ? (m.latency_ms.p50/1000).toFixed(2) + "s" : "—";
    $("mHit").textContent = ((c.hit_rate ?? 0) * 100).toFixed(0) + "%";
  }catch(e){}
}

async function refreshHealth(){
  try{
    const r = await fetch("/api/health");
    const d = await r.json();
    const ok = d.llm && d.llm.ok;
    $("dot").className = "dot " + (ok ? "on" : "off");
    $("statusText").textContent = ok ? (d.llm.model + " 就绪") : "模型未就绪";
  }catch(e){
    $("dot").className = "dot off";
    $("statusText").textContent = "服务不可达";
  }
}

/* ---------- 事件 ---------- */
go.onclick = ask;
ta.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") ask();
});

refreshHealth();
refreshMetrics();
setInterval(refreshMetrics, 30000);
</script>
</body>
</html>
